name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the DMG to"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-direct-distribution-dmg:
    name: Build Direct Distribution DMG
    runs-on: xcode-27
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.2.0.app/Contents/Developer"
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SIGNING_IDENTITY: "Developer ID Application"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set Up Paths
        run: |
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Import Developer ID Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm "$CERTIFICATE_PATH"

      - name: Write App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: echo "$API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Archive
        run: |
          xcodebuild archive \
            -project RunCatNeo.xcodeproj \
            -scheme RunCatNeo \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$BUILD_DIR/RunCatNeo.xcarchive" \
            -skipPackagePluginValidation \
            DIRECT_DISTRIBUTION=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" | \
            xcbeautify

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath "$BUILD_DIR/RunCatNeo.xcarchive" \
            -exportPath "$BUILD_DIR/export" \
            -exportOptionsPlist .github/ExportOptions.plist | \
            xcbeautify

      - name: Verify Direct Distribution
        run: |
          DIRECT_DISTRIBUTION="$(/usr/libexec/PlistBuddy -c "Print :DIRECT_DISTRIBUTION" "$BUILD_DIR/export/RunCatNeo.app/Contents/Info.plist")"
          test "$DIRECT_DISTRIBUTION" = "YES"

      - name: Notarize App
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$BUILD_DIR/export/RunCatNeo.app" "$BUILD_DIR/RunCatNeo.zip"
          xcrun notarytool submit "$BUILD_DIR/RunCatNeo.zip" \
            --key "$API_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$BUILD_DIR/export/RunCatNeo.app"
          spctl --assess --type execute --verbose "$BUILD_DIR/export/RunCatNeo.app"

      - name: Create DMG
        run: |
          DMG_SOURCE_DIR="$BUILD_DIR/dmg"
          mkdir -p "$DMG_SOURCE_DIR"
          cp -R "$BUILD_DIR/export/RunCatNeo.app" "$DMG_SOURCE_DIR/"
          ln -s /Applications "$DMG_SOURCE_DIR/Applications"
          hdiutil create \
            -volname "RunCat Neo" \
            -srcfolder "$DMG_SOURCE_DIR" \
            -format UDZO \
            "$BUILD_DIR/RunCatNeo_$TAG.dmg"
          codesign --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp "$BUILD_DIR/RunCatNeo_$TAG.dmg"

      - name: Notarize DMG
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit "$BUILD_DIR/RunCatNeo_$TAG.dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$BUILD_DIR/RunCatNeo_$TAG.dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$BUILD_DIR/RunCatNeo_$TAG.dmg"

      - name: Upload DMG to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$BUILD_DIR/RunCatNeo_$TAG.dmg"

      - name: Clean Up Signing Assets
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$API_KEY_PATH"
